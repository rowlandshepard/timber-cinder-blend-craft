<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cell Division Cards</title>
  <meta name="description" content="Study flashcards for Lecture 3 — The Cell and Cell Division." />
  <style>
    :root {
      --bg: #0b0c0b;
      --surface: #141614;
      --surface-2: #1b1e1b;
      --fg: #eef1ee;
      --muted: #8e948c;
      --subtle: #6b716c;
      --accent: #d7ddd4;
      --accent-fg: #0b0c0b;
      --sage: #a8b5aa;
      --border: #2a2d2a;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 2rem 1rem 3rem; }
    .wrap { max-width: 40rem; margin: 0 auto; }
    .eyebrow {
      font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--sage); font-weight: 600; margin-bottom: 0.35rem;
    }
    h1 {
      font-weight: 500; font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.03em;
    }
    .lede { color: var(--muted); margin-top: 0.5rem; font-size: 0.95rem; }
    .scene { perspective: 1400px; height: 22rem; margin: 1.5rem 0; }
    .card {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 350ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer; border: 0; background: none; color: inherit;
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); padding: 2rem 1.75rem; text-align: left;
      display: flex; flex-direction: column;
    }
    .back { transform: rotateY(180deg); background: var(--surface-2); }
    .label {
      font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--sage); font-weight: 600; margin-bottom: 1rem;
    }
    .q { font-size: 1.35rem; line-height: 1.3; }
    .a { font-size: 1.05rem; line-height: 1.55; }
    .hint { margin-top: auto; font-size: 0.75rem; color: var(--subtle); }
    .bar { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 0.75rem 0 0.25rem; }
    .fill { height: 100%; background: var(--sage); width: 0%; }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    button.ctrl {
      height: 44px; padding: 0 1rem; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--fg); font: 600 0.9rem/1 system-ui, sans-serif;
      cursor: pointer;
    }
    button.ctrl.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
    .keys { text-align: center; color: var(--subtle); font-size: 0.75rem; margin-top: 1.25rem; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Lecture 3</p>
    <h1>Cell Division Cards</h1>
    <p class="lede">The cell and cell division. Tap a card to flip it.</p>
    <div class="meta"><span id="counter">1 / 1</span><span id="topic"></span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="scene">
      <button class="card" id="card" type="button" aria-label="Flip flashcard">
        <div class="face">
          <div class="label">Question</div>
          <div class="q" id="q"></div>
          <div class="hint">Tap or press Space to flip</div>
        </div>
        <div class="face back">
          <div class="label">Answer</div>
          <div class="a" id="a"></div>
        </div>
      </button>
    </div>
    <div class="row">
      <button class="ctrl" id="prev" type="button">Prev</button>
      <button class="ctrl primary" id="flip" type="button">Flip</button>
      <button class="ctrl" id="next" type="button">Next</button>
      <button class="ctrl" id="shuffle" type="button">Shuffle</button>
      <button class="ctrl" id="reset" type="button">Reset</button>
    </div>
    <p class="keys">Space flip · arrows navigate · S shuffle</p>
  </div>
  <script>
    const CARDS = [
      { t: "Junctions", q: "What are the three types of intercellular junctions and their main roles?", a: "Tight junctions seal cells so substances cannot pass between them. Desmosomes give mechanical strength. Gap junctions form channels so molecules can flow and cells can coordinate." },
      { t: "Growth", q: "Define hypertrophy versus hyperplasia.", a: "Hypertrophy is an increase in cell size. Hyperplasia is an increase in cell number." },
      { t: "Growth", q: "What do atrophy, metaplasia, and neoplasia mean?", a: "Atrophy: shrinkage by smaller or fewer cells. Metaplasia: one cell type changes into another. Neoplasia: uncontrolled growth that forms a tumor. Dysplasia is a pre-neoplastic change." },
      { t: "Death", q: "How does necrosis differ from apoptosis?", a: "Necrosis follows severe damage: contents spill out and trigger inflammation. Apoptosis is programmed death: lysosomes digest contents inside the cell, so there is no spill and no inflammatory response." },
      { t: "Organelles", q: "What is cytoplasm?", a: "Cytoplasm is cytosol plus organelles. Cytosol is the jelly-like intracellular fluid that holds dissolved nutrients." },
      { t: "Organelles", q: "What is the function of mitochondria?", a: "They produce ATP — the powerhouse of the cell. Folded inner membranes increase surface area so energy production is more efficient." },
      { t: "Organelles", q: "How do rough ER and smooth ER differ?", a: "Rough ER is studded with ribosomes and makes proteins for export, the plasma membrane, or lysosomes. Smooth ER makes lipids and carbohydrates, stores calcium, and detoxifies — it is especially well developed in the liver." },
      { t: "Organelles", q: "What does the Golgi apparatus do?", a: "It modifies, packages, and ships proteins in vesicles. Material from the rough ER is received, processed, then sent to the membrane, secreted, or stored as lysosomes." },
      { t: "Organelles", q: "How do lysosomes differ from peroxisomes?", a: "Lysosomes digest food, bacteria, and worn-out organelles. Peroxisomes break down hydrogen peroxide and help prevent oxygen free-radical damage." },
      { t: "Organelles", q: "Where are ribosomes found, and what do they make?", a: "Free ribosomes make proteins used inside the cell. Ribosomes on the rough ER make proteins for export, membranes, or lysosomes." },
      { t: "Organelles", q: "What is the nucleus’s job, and what is chromatin?", a: "The nucleus controls protein synthesis via DNA. Chromatin is DNA wrapped around histone proteins. The nucleolus makes ribosomes. Nuclear pores let mRNA leave the nucleus." },
      { t: "Cytoskeleton", q: "Name the three cytoskeleton fiber sizes.", a: "Microfilaments (small), intermediate filaments (medium), and microtubules (large)." },
      { t: "Cytoskeleton", q: "What do cilia, flagella, and microvilli do?", a: "Cilia beat to move mucus and debris. Flagella produce directional movement. Microvilli increase surface area for absorption." },
      { t: "Cytoskeleton", q: "What is the mitotic spindle made of?", a: "Microtubules plus centrosomes. The spindle pulls sister chromatids apart so each daughter cell gets the right DNA." },
      { t: "Clinical", q: "What happens in primary ciliary dyskinesia (PCD)?", a: "Non-functional cilia so mucus is not cleared — chronic infections. About a 50% chance of situs inversus. It is not cystic fibrosis." },
      { t: "Dogma", q: "What is the Central Dogma sequence?", a: "DNA is transcribed to mRNA. mRNA is translated into protein at a ribosome." },
      { t: "Dogma", q: "Which part of the Central Dogma is the source of a genetic disease?", a: "Faulty DNA. Mutations produce abnormal proteins." },
      { t: "Cell cycle", q: "What happens in S phase of interphase?", a: "DNA is replicated. Each chromosome becomes two identical sister chromatids." },
      { t: "Cell cycle", q: "Name the four phases of mitosis in order.", a: "Prophase, metaphase, anaphase, telophase — followed by cytokinesis." },
      { t: "Cell cycle", q: "What occurs during prophase?", a: "Chromosomes condense, the nuclear envelope disappears, and the mitotic spindle begins to form." },
      { t: "Cell cycle", q: "What occurs during metaphase?", a: "The spindle lines chromosomes up along the metaphase plate — the equator of the cell." },
      { t: "Cell cycle", q: "What occurs during anaphase?", a: "Sister chromatids separate and migrate to opposite poles." },
      { t: "Cell cycle", q: "What happens in telophase, and what is cytokinesis?", a: "Daughter nuclei form and the nuclear envelope reforms. Cytokinesis divides the cytoplasm into two cells." },
      { t: "Cell cycle", q: "What is the outcome of mitosis?", a: "Two genetically identical daughter cells. Mitosis preserves the original genetic information." },
      { t: "Cell cycle", q: "How do homologous chromosomes differ from sister chromatids?", a: "Homologous chromosomes are the two non-identical parental copies (23 pairs in humans). Sister chromatids are identical copies created in S phase." }
    ];
    let order = CARDS.map((_, i) => i);
    let i = 0;
    let flipped = false;
    const el = {
      card: document.getElementById("card"),
      q: document.getElementById("q"),
      a: document.getElementById("a"),
      counter: document.getElementById("counter"),
      topic: document.getElementById("topic"),
      fill: document.getElementById("fill"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      flip: document.getElementById("flip"),
      shuffle: document.getElementById("shuffle"),
      reset: document.getElementById("reset"),
    };
    function render() {
      const c = CARDS[order[i]];
      el.q.textContent = c.q;
      el.a.textContent = c.a;
      el.topic.textContent = c.t;
      el.counter.textContent = (i + 1) + " / " + CARDS.length;
      el.fill.style.width = ((i + 1) / CARDS.length * 100) + "%";
      el.card.classList.toggle("flipped", flipped);
      el.prev.disabled = i === 0;
      el.next.disabled = i === CARDS.length - 1;
    }
    function flip() { flipped = !flipped; el.card.classList.toggle("flipped", flipped); }
    function go(d) {
      const n = i + d;
      if (n < 0 || n >= CARDS.length) return;
      i = n; flipped = false; render();
    }
    el.card.addEventListener("click", flip);
    el.flip.addEventListener("click", (e) => { e.stopPropagation(); flip(); });
    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    el.shuffle.addEventListener("click", () => {
      for (let x = order.length - 1; x > 0; x--) {
        const y = Math.floor(Math.random() * (x + 1));
        [order[x], order[y]] = [order[y], order[x]];
      }
      i = 0; flipped = false; render();
    });
    el.reset.addEventListener("click", () => {
      order = CARDS.map((_, n) => n); i = 0; flipped = false; render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "ArrowRight") go(1);
      else if (e.key === "s" || e.key === "S") el.shuffle.click();
    });
    render();
  </script>
</body>
</html>
